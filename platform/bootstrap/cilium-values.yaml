# Bootstrap CNI, installed by Helm before ArgoCD (bootstrap tier).
kubeProxyReplacement: true
k8sServiceHost: harborlab-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
operator:
  replicas: 1
hubble:
  enabled: false
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
envoy:
  securityContext:
    capabilities:
      # Port 443 on the node's host network needs NET_BIND_SERVICE.
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
