# Platform-tier namespaces running pods: the Applications (or kind, for local-path-storage) create them,
# this file labels them. Pods need a tier (policy tier-required); Argo CD never deletes these namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    harborlab.io/tier: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
