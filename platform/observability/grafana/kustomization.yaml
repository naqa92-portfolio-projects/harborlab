apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - credentials.yaml
  - route.yaml
  - network-policy.yaml
# Mounted by the Grafana chart (dashboardsConfigMaps) under a fixed name.
configMapGenerator:
  - name: grafana-dashboard-image-posture
    files:
      - image-posture.json
generatorOptions:
  disableNameSuffixHash: true
