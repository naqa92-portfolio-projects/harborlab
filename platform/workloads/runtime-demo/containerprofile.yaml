# Authored Kubescape profile of the runtime-demo container (pod label kubescape.io/user-defined-profile):
# node-agent enforces it from container start instead of learning one, so a recreated pod raises runtime
# alerts at once. Recorded from the container's learned profile; a shell is not part of it.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: runtime-demo
  namespace: runtime-demo
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures:
    - amd64
  capabilities:
    - CAP_DAC_OVERRIDE
    - CAP_DAC_READ_SEARCH
    - CAP_SYS_ADMIN
  execs:
    - path: /usr/bin/python3.13
      args:
        - /usr/bin/python3
        - -c
        - import signal; signal.pause()
  opens:
    - path: /
      flags:
        - O_RDONLY
        - O_NONBLOCK
        - O_DIRECTORY
        - O_CLOEXEC
    - path: /etc/ld.so.cache
