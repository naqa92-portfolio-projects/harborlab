[project]
name = "dt-bridge"
version = "0.1.0"
description = "Forwards attested SBOMs and VEX documents of harborlab images to Dependency-Track"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2025.1.31",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
