# Kubescape operator without any ARMO backend: posture and CIS scans, runtime observation and detection, and
# relevancy-aware Grype scans published as OpenVEX in its storage API. Wave 3 so the node agent sees the
# workload containers (wave 4) from their start. Memory is capped to about 3 GiB in total.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescape
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kubescape
  source:
    repoURL: https://kubescape.github.io/helm-charts/
    chart: kubescape-operator
    targetRevision: 1.40.4
    helm:
      releaseName: kubescape
      valuesObject:
        clusterName: harborlab
        # Default runtime rules (Rules default-rules, RuntimeRuleAlertBinding all-rules-all-pods): node-agent
        # prints each alert as a JSON line on its stderr, shipped to VictoriaLogs.
        alertCRD:
          installDefault: true
        # Certificates generated at runtime by init containers: template ones change on every render.
        certificates:
          strategy: initContainer
        capabilities:
          configurationScan: enable
          continuousScan: disable
          nodeScan: enable
          nodeSbomGeneration: enable
          vulnerabilityScan: enable
          relevancy: enable
          vexGeneration: enable
          runtimeObservability: enable
          runtimeDetection: enable
          networkPolicyService: disable
          networkEventsStreaming: disable
          nodeProfileService: disable
          admissionController: disable
          httpDetection: disable
          seccompProfileService: disable
          malwareDetection: disable
          autoUpgrading: disable
          syncSBOM: disable
          manageWorkloads: disable
          prometheusExporter: disable
        kubescape:
          # Controls come from the policy library of the image: nothing is downloaded from GitHub.
          downloadArtifacts: false
          skipUpdateCheck: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
        operator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
        kubevuln:
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1536Mi
              ephemeral-storage: 5Gi
        storage:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
        nodeAgent:
          config:
            # One alert per container and rule, then silence for this long (chart default 1h): every
            # `task demo:runtime-shell` run raises its own alert.
            ruleCooldown:
              ruleCooldownDuration: 10s
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 700Mi
  ignoreDifferences:
    # The storage certgen init container writes its CA into the APIService at runtime.
    - group: apiregistration.k8s.io
      kind: APIService
      jsonPointers:
        - /spec/caBundle
        - /spec/insecureSkipTLSVerify
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
