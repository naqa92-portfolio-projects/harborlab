# Runtime-detection demo target in its workload namespace; the image is its Harbor `apps` digest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: platform/workloads/runtime-demo
  # Kubescape storage lists ContainerProfiles without their spec (only resourceVersion=fullSpec has it).
  ignoreDifferences:
    - group: spdx.softwarecomposition.kubescape.io
      kind: ContainerProfile
      jsonPointers:
        - /spec
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
