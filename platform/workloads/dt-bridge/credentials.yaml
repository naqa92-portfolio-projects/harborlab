# dt-bridge credentials from OpenBao: the Harbor read-only robot, the Dependency-Track API key of its
# least-privilege team (created by `task up`) and the dhi.io pull token for the DHI OpenVEX attestations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-robot-dt-bridge
  namespace: dt-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-robot-dt-bridge
  data:
    - secretKey: username
      remoteRef:
        key: platform/harbor-robot-dt-bridge
        property: username
    - secretKey: password
      remoteRef:
        key: platform/harbor-robot-dt-bridge
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-api-key
  namespace: dt-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dependency-track-api-key
  data:
    - secretKey: api-key
      remoteRef:
        key: platform/dependency-track-api-key
        property: api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dhi-credentials
  namespace: dt-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dhi-credentials
  data:
    - secretKey: username
      remoteRef:
        key: platform/dhi
        property: username
    - secretKey: token
      remoteRef:
        key: platform/dhi
        property: token
