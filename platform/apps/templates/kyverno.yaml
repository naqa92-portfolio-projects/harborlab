# Kyverno admission (CEL policy types only). The bootstrap namespaces stay outside the policies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        # The chart's post-delete hook keeps Argo CD out of sync and blocks pruning.
        config:
          preserve: false
        webhookLabels:
          app.kubernetes.io/managed-by: argocd
  ignoreDifferences:
    {{- toYaml .Values.webhookCaBundleDifferences | nindent 4 }}
    # Aggregated ClusterRoles are filled in by the controller manager.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /rules
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
