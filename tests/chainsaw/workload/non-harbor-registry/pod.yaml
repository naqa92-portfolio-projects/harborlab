apiVersion: v1
kind: Pod
metadata:
  name: non-harbor-registry
spec:
  # Admission is under test: no node matches, so the image is never pulled.
  nodeSelector:
    harborlab.io/e2e: unschedulable
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/naqa92-portfolio-projects/harborlab/offlist/compliant:e2e
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
