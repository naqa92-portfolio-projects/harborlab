# In a workload namespace, a pod whose image is signed by this repository's fixtures.yml workflow, not by build-image.yml is denied by workload-image-signature.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-foreign-signer
spec:
  namespaceTemplate:
    metadata:
      labels:
        harborlab.io/tier: workload
  timeouts:
    apply: 60s
    assert: 150s
    error: 30s
    exec: 120s
  steps:
    - name: admission denies the pod
      try:
        - script:
            content: kubectl apply -n "$NAMESPACE" -f pod.yaml
            check:
              ($error != null): true
              (contains($stderr, 'workload-image-signature')): true
              (contains($stderr, 'image is not signed by the harborlab build-image workflow')): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: foreign-signer
