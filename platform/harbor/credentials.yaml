# Harbor credentials, seeded in OpenBao by `task up`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-admin
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: platform/harbor-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-db-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: platform/harbor-db
        property: username
    - secretKey: password
      remoteRef:
        key: platform/harbor-db
        property: password
---
# Keys: secret, CSRF_KEY, JOBSERVICE_SECRET, REGISTRY_HTTP_SECRET, secretKey (chart value names).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-internal
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-internal
  dataFrom:
    - extract:
        key: platform/harbor-internal
---
# RSA key pair signing the registry tokens issued by Harbor core.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-token-service
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-token-service
  dataFrom:
    - extract:
        key: platform/harbor-token-service
---
# The bcrypt salt differs on each render: synced only when this spec changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: harbor
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-registry-credentials
    template:
      data:
        REGISTRY_PASSWD: "{{ .password }}"
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: platform/harbor-registry
        property: password
