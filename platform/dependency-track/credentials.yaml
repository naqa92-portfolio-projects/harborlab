# Database credentials, seeded in OpenBao by `task up`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-db-credentials
  namespace: dependency-track
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dependency-track-db-credentials
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: platform/dependency-track-db
        property: username
    - secretKey: password
      remoteRef:
        key: platform/dependency-track-db
        property: password
