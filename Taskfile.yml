version: '3'

# Local secrets (DHI_TOKEN) come from the git-ignored .env when present; CI sets them in the environment.
dotenv: ['.env']

tasks:
  up:
    desc: Create or converge the kind platform; returns once every Argo CD Application is stable
    cmds:
      - ./scripts/platform-up.sh

  harbor:configure:
    desc: Seed missing robot secrets in OpenBao, then apply the OpenTofu Harbor configuration (tofu/harbor)
    cmds:
      - ./scripts/harbor-tofu.sh configure

  harbor:plan:
    desc: Plan the OpenTofu Harbor configuration; exits 0 only when nothing would change
    cmds:
      - ./scripts/harbor-tofu.sh plan

  harbor:tofu:
    desc: 'Run tofu <args> in tofu/harbor with the OpenBao and Harbor environment (task harbor:tofu -- show -json)'
    silent: true
    cmds:
      - ./scripts/harbor-tofu.sh tofu {{.CLI_ARGS}}

  down:
    desc: Delete the kind platform and its isolated kubeconfig
    cmds:
      - ./scripts/platform-down.sh
