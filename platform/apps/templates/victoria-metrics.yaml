# VictoriaMetrics single node (Decision 15): scrapes the image posture metrics dt-bridge exposes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-single
    targetRevision: 0.47.0
    helm:
      valuesObject:
        server:
          fullnameOverride: victoria-metrics
          retentionPeriod: 7d
          persistentVolume:
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          scrape:
            enabled: true
            config:
              global:
                scrape_interval: 30s
              scrape_configs:
                - job_name: dt-bridge
                  static_configs:
                    - targets:
                        - dt-bridge.dt-bridge.svc.cluster.local:8080
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
