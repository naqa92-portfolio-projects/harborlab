# Cluster state read by the policies: the E2E registry params of tests/chainsaw/params, verbatim.
# Image data is never mocked here: tests/kyverno/run.sh fetches it from the registry.
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: harborlab-registries
        namespace: kyverno
      data:
        workload: |
          harbor.127.0.0.1.nip.io/golden/
          harbor.127.0.0.1.nip.io/apps/
          ghcr.io/naqa92-portfolio-projects/harborlab/fixtures/
        platform: |
          harbor.127.0.0.1.nip.io
          docker.io
          quay.io
          ghcr.io
          registry.k8s.io
          dhi.io
          reg.kyverno.io
