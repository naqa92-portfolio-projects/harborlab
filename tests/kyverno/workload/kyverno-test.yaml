# Workload tier (harborlab.io/tier=workload): each deny case fails exactly the policy of its rule and
# passes the others it is expected to satisfy; the compliant pod passes all of them. Kyverno CEL
# policies report `fail`, never `warn`: the deprecated base fails workload-golden-base-deprecated,
# whose Warn/Audit actions admit it with a warning (proven by Chainsaw).
# Run through tests/kyverno/run.sh, which pins fixture tags to digests and fetches image metadata.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload
policies:
  - ../../../policies/workload/image-signature.yaml
  - ../../../policies/workload/golden-base.yaml
  - ../../../policies/workload/golden-base-deprecated.yaml
  - ../../../policies/workload/image-labels.yaml
  - ../../../policies/workload/registry.yaml
  - ../../../policies/workload/pod-security.yaml
resources:
  - resources/pods.yaml
  - resources/namespace.yaml
variables: values.yaml
context: context.yaml
results:
  - policy: workload-image-signature
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/unsigned
      - workload-test/foreign-signer
      - workload-test/no-sbom
    result: fail
  - policy: workload-image-signature
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/compliant
      - workload-test/non-harbor-registry
      - workload-test/eol-base
      - workload-test/unknown-base
      - workload-test/missing-labels
      - workload-test/deprecated-base
    result: pass
  - policy: workload-golden-base
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/eol-base
      - workload-test/unknown-base
    result: fail
  - policy: workload-golden-base
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/compliant
      - workload-test/non-harbor-registry
      - workload-test/no-sbom
      - workload-test/missing-labels
      - workload-test/deprecated-base
    result: pass
  - policy: workload-golden-base-deprecated
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/deprecated-base
    result: fail
  - policy: workload-golden-base-deprecated
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/compliant
      - workload-test/non-harbor-registry
      - workload-test/eol-base
      - workload-test/unknown-base
      - workload-test/no-sbom
      - workload-test/missing-labels
    result: pass
  - policy: workload-image-labels
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/missing-labels
    result: fail
  - policy: workload-image-labels
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/compliant
      - workload-test/unsigned
      - workload-test/foreign-signer
      - workload-test/non-harbor-registry
      - workload-test/eol-base
      - workload-test/unknown-base
      - workload-test/no-sbom
      - workload-test/deprecated-base
    result: pass
  - policy: workload-registry
    isValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/non-harbor-registry
    result: fail
  - policy: workload-registry
    isValidatingPolicy: true
    kind: Pod
    resources:
      - workload-test/compliant
      - workload-test/unsigned
      - workload-test/foreign-signer
      - workload-test/eol-base
      - workload-test/unknown-base
      - workload-test/no-sbom
      - workload-test/missing-labels
      - workload-test/deprecated-base
    result: pass
  - policy: workload-pod-security
    isMutatingPolicy: true
    kind: Namespace
    resources:
      - new-workload
    patchedResources: patched/namespace.yaml
    result: pass
