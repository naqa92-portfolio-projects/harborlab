# Grafana admin credentials from OpenBao, seeded once by `task up`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    # Before the Grafana Deployment, which reads the Secret at start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana-admin
        property: password
---
# Identity of this namespace towards OpenBao (ClusterSecretStore openbao); no pod runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
