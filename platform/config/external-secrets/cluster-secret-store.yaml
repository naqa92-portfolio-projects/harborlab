# External Secrets reads platform credentials from OpenBao KV v2 with Kubernetes auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-reader
            namespace: external-secrets
