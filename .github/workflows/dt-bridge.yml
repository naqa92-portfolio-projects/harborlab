name: dt-bridge

# Golden-path contract: the platform's build-image.yml builds, scans, signs and attests the image.
# PRD branches (prd-*) publish too, so the image exists before the merge.
on:
  push:
    branches:
      - main
      - prd-*
    paths:
      - apps/dt-bridge/**
      - .github/workflows/dt-bridge.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: dt-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: apps/dt-bridge
      context: apps/dt-bridge
