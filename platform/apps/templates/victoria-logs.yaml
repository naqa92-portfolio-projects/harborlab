# VictoriaLogs single node and its vlagent DaemonSet (Decision 15). vlagent ships every container log,
# the Kubescape node-agent alerts and the API server audit events included, parsing JSON lines.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-logs-single
      targetRevision: 0.13.9
      helm:
        releaseName: victoria-logs
        valuesObject:
          server:
            fullnameOverride: victoria-logs
            retentionPeriod: 7d
            persistentVolume:
              size: 2Gi
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 160Mi
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-logs-collector
      targetRevision: 0.3.7
      helm:
        releaseName: victoria-logs-collector
        valuesObject:
          fullnameOverride: victoria-logs-collector
          remoteWrite:
            - url: http://victoria-logs.observability.svc.cluster.local:9428
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
