apiVersion: v1
kind: Pod
metadata:
  name: off-list-registry
spec:
  # Admission is under test: no node matches, so the image is never pulled.
  nodeSelector:
    harborlab.io/e2e: unschedulable
  containers:
    - name: main
      image: public.ecr.aws/docker/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
