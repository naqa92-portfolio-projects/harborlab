# API server audit policy: Pod writes only, with their request (the images), so the admission denials
# Kyverno answers reach VictoriaLogs; a Kyverno CEL denial emits no Kubernetes Event.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
  - ResponseStarted
rules:
  - level: Request
    verbs: [create, update, patch]
    resources:
      - group: ""
        resources: [pods, pods/ephemeralcontainers]
  - level: None
