# Bootstrap GitOps controller, installed by Helm; everything else is an Application of `root`.
dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    # TLS terminates at the Cilium Gateway.
    server.insecure: true
  cm:
    # `root` orders its Applications by sync wave and waits for each wave to be Healthy, which needs
    # an Application health check (Argo CD removed the built-in one).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # A Kyverno CEL policy admits nothing until Kyverno has configured its webhook.
    resource.customizations.health.policies.kyverno.io_ValidatingPolicy: &kyverno-policy-health |
      hs = {}
      if obj.status ~= nil and obj.status.conditionStatus ~= nil and obj.status.conditionStatus.ready == true then
        hs.status = "Healthy"
        hs.message = "Webhook configured"
        return hs
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Kyverno to configure the policy webhook"
      return hs
    resource.customizations.health.policies.kyverno.io_ImageValidatingPolicy: *kyverno-policy-health
    resource.customizations.health.policies.kyverno.io_MutatingPolicy: *kyverno-policy-health
