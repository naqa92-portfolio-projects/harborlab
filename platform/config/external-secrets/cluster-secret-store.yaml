# External Secrets reads platform credentials from OpenBao KV v2 with Kubernetes auth. Only the listed
# consumer namespaces may use the store; each authenticates as its own ServiceAccount openbao-reader
# (no namespace below), whose OpenBao policy covers only that namespace's credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - cert-manager
        - harbor
        - dependency-track
        - dt-bridge
        - observability
        - registry-mirror-test
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: openbao-reader
