# One pod per admission case in a workload namespace. Fixture tags are pinned to their digest and the
# image metadata is fetched from the registry by tests/kyverno/run.sh before `kyverno test` runs.
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: workload-test
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/naqa92-portfolio-projects/harborlab/fixtures/compliant:${FIXTURE_TAG}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
---
