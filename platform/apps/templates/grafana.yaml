# Grafana (Decision 15) with the VictoriaMetrics and VictoriaLogs datasources and the image posture
# dashboard, both provisioned from Git. The admin credentials come from OpenBao through External Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.2.6
      helm:
        releaseName: grafana
        valuesObject:
          testFramework:
            enabled: false
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          plugins:
            - victoriametrics-logs-datasource
          grafana.ini:
            server:
              root_url: https://grafana.127.0.0.1.nip.io
            analytics:
              check_for_updates: false
              reporting_enabled: false
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: VictoriaMetrics
                  uid: victoriametrics
                  type: prometheus
                  access: proxy
                  url: http://victoria-metrics.observability.svc.cluster.local:8428
                  isDefault: true
                  editable: false
                - name: VictoriaLogs
                  uid: victorialogs
                  type: victoriametrics-logs-datasource
                  access: proxy
                  url: http://victoria-logs.observability.svc.cluster.local:9428
                  editable: false
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: harborlab
                  orgId: 1
                  folder: harborlab
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/harborlab
          dashboardsConfigMaps:
            harborlab: grafana-dashboard-image-posture
          # Grafana 13 settles near 250 Mi; below its GOMEMLIMIT (90% of the limit) its start-up spins in GC,
          # and Explore on a VictoriaLogs query was OOMKilled at 448Mi.
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
          # Start-up (plugin install, storage migrations) exceeds the default 60 s liveness delay.
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 30
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: platform/observability/grafana
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
