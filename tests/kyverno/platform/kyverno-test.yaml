# Platform tier (harborlab.io/tier=platform): an off-list registry fails the allow-list, an allow-listed
# one passes; Kyverno, Cilium and Argo CD images pass the vendor-signature policy, and an Argo CD
# release published before Argo CD signed its images fails it (both policies only report: Audit).
# Run through tests/kyverno/run.sh, which fetches image metadata from the registries.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform
policies:
  - ../../../policies/platform/registry-allow-list.yaml
  - ../../../policies/platform/vendor-signatures.yaml
resources:
  - resources/pods.yaml
variables: values.yaml
context: context.yaml
results:
  - policy: platform-registry-allow-list
    isValidatingPolicy: true
    kind: Pod
    resources:
      - platform-test/off-list-registry
    result: fail
  - policy: platform-registry-allow-list
    isValidatingPolicy: true
    kind: Pod
    resources:
      - platform-test/allow-listed-registry
      - platform-test/vendor-kyverno
      - platform-test/vendor-cilium
      - platform-test/vendor-argocd
      - platform-test/vendor-unsigned
    result: pass
  - policy: platform-vendor-signatures
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - platform-test/vendor-kyverno
      - platform-test/vendor-cilium
      - platform-test/vendor-argocd
    result: pass
  - policy: platform-vendor-signatures
    isImageValidatingPolicy: true
    kind: Pod
    resources:
      - platform-test/vendor-unsigned
    result: fail
