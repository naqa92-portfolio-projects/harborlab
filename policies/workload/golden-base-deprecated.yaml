# Workload tier: an image built on a deprecated golden base is admitted with a warning and reported.
# CEL policies report `fail`: the Warn and Audit actions are what admit the pod.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: workload-golden-base-deprecated
spec:
  validationActions: [Warn, Audit]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      # kubectl debug adds containers through this subresource.
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
    namespaceSelector:
      matchLabels:
        harborlab.io/tier: workload
  matchImageReferences:
    - glob: "*"
  # Signatures are workload-image-signature's rule: this policy reports only its own.
  validationConfigurations:
    required: false
  attestors:
    - name: build
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: ^https://github\.com/naqa92-portfolio-projects/harborlab/\.github/workflows/build-image\.yml@refs/heads/main$
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: slsa
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: images
      expression: >-
        images.?containers.orValue([]) + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([])
    - name: catalog
      expression: resource.Get("v1", "configmaps", "kyverno", "golden-images").?data.orValue({})
    - name: statuses
      expression: >-
        variables.images.map(ref,
          verifyAttestationSignatures(ref, attestations.slsa, [attestors.build]) > 0
            ? extractPayload(ref, attestations.slsa).predicate.buildDefinition.resolvedDependencies
                .filter(dep, dep.?uri.orValue("").startsWith("oci://"))
                .map(dep, variables.catalog[?("sha256." + dep.?digest.?sha256.orValue(""))].orValue("unknown"))
            : ["unverified"])
  validations:
    - expression: >-
        variables.statuses.all(s, !("deprecated" in s))
      message: image base is a deprecated golden image
