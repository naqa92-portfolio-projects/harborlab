name: hello-java

# Golden-path contract: the platform's build-image.yml builds, scans, signs and attests the image.
# PRD branches (prd-*) publish too, so the image exists before the merge.
on:
  push:
    branches:
      - main
      - prd-*
    paths:
      - apps/hello-java/**
      - .github/workflows/hello-java.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: hello-java-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: apps/hello-java
      context: apps/hello-java
