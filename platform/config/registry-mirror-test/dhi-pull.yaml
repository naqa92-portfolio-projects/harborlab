# Namespace of the registry mirror checks; dhi.io refuses anonymous pulls, so its upstream fallback
# authenticates with this pull secret (the token is seeded in OpenBao by `task up`).
apiVersion: v1
kind: Namespace
metadata:
  name: registry-mirror-test
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dhi-pull
  namespace: registry-mirror-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dhi-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"dhi.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: platform/dhi
        property: username
    - secretKey: token
      remoteRef:
        key: platform/dhi
        property: token
