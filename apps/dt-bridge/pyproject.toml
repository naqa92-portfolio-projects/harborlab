[project]
name = "dt-bridge"
version = "0.1.0"
description = "Forwards attested SBOMs and VEX documents of harborlab images to Dependency-Track"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.format]
quote-style = "double"
