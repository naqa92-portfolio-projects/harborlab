# In a workload namespace, a pod whose image carries no signature is denied by workload-image-signature.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-unsigned
spec:
  namespaceTemplate:
    metadata:
      labels:
        harborlab.io/tier: workload
  timeouts:
    apply: 60s
    assert: 150s
    error: 30s
    exec: 120s
  steps:
    - name: admission denies the pod
      try:
        - script:
            content: ../../../fixtures/fixture-tag.sh pod.yaml | kubectl apply -n "$NAMESPACE" -f -
            check:
              ($error != null): true
              (contains($stderr, 'workload-image-signature')): true
              (contains($stderr, 'image is not signed by the harborlab build-image workflow')): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: unsigned
